[package]
name = "rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
uniffi = { version = "0.32.0", features = ["tokio", "build", "cli"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
parking_lot = "0.12.5"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_DirectX_Direct3D11",
    "Media",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_MediaProperties",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_OpenGL",
    "Win32_Foundation",
    "Win32_Security"
]}
windows-future = { version = "0.3.2", features = ["std"] }
crossbeam-channel = "0.5.17"

[build-dependencies]
uniffi = { version = "0.32.1", features = [ "build" ] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
